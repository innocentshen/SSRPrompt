name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ssrprompt/server prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ssrprompt_ci

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Server tests
        run: pnpm --filter @ssrprompt/server test

      - name: Client tests
        run: pnpm --filter @ssrprompt/client test

      - name: Build all packages
        run: pnpm run build:all
